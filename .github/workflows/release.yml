name: Release
# Cuts a GitHub Release for every `v*` tag and — only when explicitly enabled —
# publishes the packages to npm. Versions are tracked by tags and CHANGELOG
# regardless of whether npm publishing is on, so flipping the switch later
# publishes the next tag with no other change.
#
#   npm publishing is ON when either:
#     - the repository variable PUBLISH_TO_NPM is set to "true"
#       (Settings → Secrets and variables → Actions → Variables), or
#     - this workflow is run manually with publish_npm = true.
#   Otherwise the publish step is skipped and a notice is printed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release or re-run, e.g. v0.22.0"
        required: true
        type: string
      publish_npm:
        description: "Also publish to npm (needs the NPM_TOKEN secret)"
        required: false
        type: boolean
        default: false
permissions:
  # `contents: write` for `gh release create`.
  contents: write
  # `id-token: write` lets npm attach a signed provenance attestation.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH_NPM: ${{ (inputs.publish_npm == true || vars.PUBLISH_TO_NPM == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag matches governance-sdk version
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/governance/package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match packages/governance/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✓ Tag v$TAG matches governance-sdk version $PKG_VERSION"
      - run: npm run build
      - run: npm test

      - name: Publish packages to npm (skip already-published versions)
        if: env.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in governance governance-platform; do
            PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
              echo "⏭ $PKG_NAME@$PKG_VERSION already published, skipping"
            else
              echo "📦 Publishing $PKG_NAME@$PKG_VERSION"
              npm publish -w "packages/$pkg" --access public --provenance
            fi
          done

      - name: npm publish paused
        if: env.PUBLISH_NPM != 'true'
        run: |
          echo "::notice::npm publishing is paused; $RELEASE_TAG is released on GitHub only. To publish it later, set the repository variable PUBLISH_TO_NPM=true or run this workflow manually with publish_npm=true and tag=$RELEASE_TAG."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"             # e.g. v0.22.0
          VERSION="${TAG#v}"               # e.g. 0.22.0
          CHANGELOG="packages/governance/CHANGELOG.md"

          # Skip if a release already exists for this tag (idempotent re-run).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✓ Release $TAG already exists, skipping"
            exit 0
          fi

          # Pull the matching `## [VERSION] - DATE — TITLE` header so we can
          # use the human-readable suffix as the release title. Falls back
          # to the bare tag if the section isn't found.
          HEADER=$(grep -E "^## \[$VERSION\]" "$CHANGELOG" | head -1 || true)
          if [ -n "$HEADER" ]; then
            TITLE_SUFFIX=$(echo "$HEADER" | sed -E "s/^## \[$VERSION\] - [0-9-]+ — //")
            RELEASE_TITLE="$TAG — $TITLE_SUFFIX"
          else
            RELEASE_TITLE="$TAG"
          fi

          # Extract the CHANGELOG body for this version: everything between
          # the version header and the next "## [" header (or end of file).
          NOTES_FILE=$(mktemp)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            /^## \[/ && capture { exit }
            capture { print }
          ' "$CHANGELOG" > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No CHANGELOG section found for $VERSION; release notes will be empty"
          fi

          if [ "$PUBLISH_NPM" != "true" ]; then
            printf '\n---\n_Released on GitHub only; npm publishing is paused for this release. The package on npm may be older than this tag._\n' >> "$NOTES_FILE"
          fi

          # Pre-1.0 versions are technically prereleases by SemVer, but we
          # treat 0.x as stable for this SDK and don't want them hidden in
          # the Releases sidebar — so no --prerelease flag.
          gh release create "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE"

          echo "✓ Created release $TAG"
